<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Electricity</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#111;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:14px}
h1{margin:0 0 14px;font-size:24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 8px #0001}
.title{font-size:13px;font-weight:800;text-transform:uppercase}
.price .title{color:#111}
.price-time{
 font-size:1rem;
 font-weight:600;
 margin-top:-.35rem;
 margin-bottom:.7rem;
 color:#555;
}
.emissions .title{color:#d00000}
.big{font-size:25px;font-weight:800;margin-top:5px}
.emissions .big{color:#d00000}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat span{display:block;font-size:10px;color:#777;text-transform:uppercase}
.stat b{font-size:12px}
.controls{display:flex;gap:7px;margin-top:14px}
button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;background:#ddd}
button.active{background:#111;color:#fff}
.days{display:flex;align-items:center;gap:8px;margin-top:12px}
.days button{font-size:20px;width:45px}
#date{text-align:center;font-weight:800;flex:1}
.box{background:#fff;border-radius:15px;margin-top:12px;padding:12px;box-shadow:0 2px 8px #0001}
.chart{height:370px}
canvas{width:100%;height:100%;display:block}
.legend{display:flex;gap:18px;font-size:12px;font-weight:700;margin:8px 0}
.legend span{display:flex;gap:5px;align-items:center}
.dot{width:18px;height:3px;display:inline-block}
.black{background:#111}
.red{background:#d00000}
.info{background:#f1f1f1;border-radius:9px;padding:10px;font-size:13px}
.overview{height:140px}
@media(max-width:600px){
main{padding:10px}
.big{font-size:20px}
.card{padding:12px}
.chart{height:310px}
}
</style>
</head>
<body>
<main>
<h1>UK Electricity</h1>

<div class="cards">
<div class="card price">
<div class="title">⚡ Price</div>
<div id="price" class="big">—</div>
<div id="priceTime" class="price-time">—</div>
<div class="stats">
<div class="stat"><span>Day average</span><b id="priceDay">—</b></div>
<div class="stat"><span>30 days</span><b id="price30">—</b></div>
</div>
</div>

<div class="card emissions">
<div class="title">🔴 Emissions</div>
<div id="emissions" class="big">—</div>
<div class="stats">
<div class="stat"><span>Day average</span><b id="emissionsDay">—</b></div>
<div class="stat"><span>30 days</span><b id="emissions30">—</b></div>
</div>
</div>
</div>

<div class="controls">
<button id="bp" class="active">PRICE</button>
<button id="be">EMISSIONS</button>
<button id="bb">BOTH</button>
</div>

<div class="days">
<button id="prev">‹</button>
<div id="date"></div>
<button id="next">›</button>
</div>

<div class="box">
<div class="chart"><canvas id="chart"></canvas></div>
<div class="legend">
<span><i class="dot black"></i>Price</span>
<span><i class="dot red"></i>Emissions</span>
</div>
<div id="info" class="info">Tap the chart to inspect a time.</div>
</div>

<div class="box">
<strong>30-day overview</strong>
<div class="overview"><canvas id="overview"></canvas></div>
</div>

<script>
const P="history.json";
const E="emissions_history.json";

let prices=[];
let emissions=[];
let mode="price";
let selectedDate=null;
let selectedIndex=-1;

const chart=document.getElementById("chart");
const overview=document.getElementById("overview");

function key(v){
 return new Date(v).toISOString().slice(0,10);
}

function time(v){
 return new Date(v).toLocaleTimeString("en-GB",{
  hour:"2-digit",minute:"2-digit"
 });
}

function money(v){
 return "£"+(Number(v)/1000).toFixed(5)+"/kWh";
}

function carbon(v){
 return Number(v).toFixed(0)+" gCO₂/kWh";
}

function avg(a){
 return a.length
  ? a.reduce((x,y)=>x+Number(y),0)/a.length
  : 0;
}

function size(c){
 const r=c.getBoundingClientRect();
 const d=devicePixelRatio||1;
 c.width=r.width*d;
 c.height=r.height*d;
 const x=c.getContext("2d");
 x.setTransform(d,0,0,d,0,0);
 return{x,w:r.width,h:r.height};
}

function dayData(){
 const d=key(selectedDate);
 const p=prices.filter(x=>key(x.display_period.start)===d);
 const e=emissions.filter(x=>key(x.display_period.start)===d);

 const pm=new Map(p.map(x=>[x.display_period.start,+x.price]));
 const em=new Map(e.map(x=>[x.display_period.start,+x.emissions]));

 const times=[...new Set([
  ...p.map(x=>x.display_period.start),
  ...e.map(x=>x.display_period.start)
 ])].sort();

 return{pm,em,times};
}
function line(ctx,values,color,l,t,w,h,min,max){
 if(!values.length)return;

 const range=max-min||1;

 ctx.beginPath();

 values.forEach((v,i)=>{
  if(v===undefined)return;

  const x=l+(i/Math.max(values.length-1,1))*w;
  const y=t+h-((v-min)/range)*h;

  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 });

 ctx.strokeStyle=color;
 ctx.lineWidth=2.5;
 ctx.stroke();
}

function draw(){
 const {x,w,h}=size(chart);
 x.clearRect(0,0,w,h);

 const d=dayData();

 const l=52;
 const r=mode==="both"?58:18;
 const t=20;
 const b=38;
 const pw=w-l-r;
 const ph=h-t-b;

 x.strokeStyle="#e5e5e5";
 x.lineWidth=1;

 for(let i=0;i<=4;i++){
  const y=t+i/4*ph;
  x.beginPath();
  x.moveTo(l,y);
  x.lineTo(l+pw,y);
  x.stroke();
 }

 if(d.times.length){
  const pv=d.times.map(v=>d.pm.get(v));
  const ev=d.times.map(v=>d.em.get(v));

  if(mode==="price"||mode==="both"){
   const a=pv.filter(v=>v!==undefined);
   const min=Math.min(...a);
   const max=Math.max(...a);

   line(x,pv,"#111",l,t,pw,ph,min,max);

   x.fillStyle="#111";
   x.font="10px system-ui";

   for(let i=0;i<=4;i++){
    const v=max-(max-min)*i/4;
    x.fillText(money(v).replace("/kWh",""),3,t+i/4*ph);
   }
  }

  if(mode==="emissions"||mode==="both"){
   const a=ev.filter(v=>v!==undefined);
   const min=Math.min(...a);
   const max=Math.max(...a);

   line(x,ev,"#d00000",l,t,pw,ph,min,max);

   x.fillStyle="#d00000";
   x.font="10px system-ui";

   for(let i=0;i<=4;i++){
    const v=max-(max-min)*i/4;
    x.fillText(
     Math.round(v),
     w-r+7,
     t+i/4*ph
    );
   }
  }

  x.fillStyle="#777";
  x.textAlign="center";
  x.font="10px system-ui";

  for(let i=0;i<d.times.length;i+=4){
   const xx=l+
    i/Math.max(d.times.length-1,1)*pw;

   x.fillText(time(d.times[i]),xx,h-15);
  }

  x.textAlign="left";
 }
}

function updateCards(){
 const d=dayData();

 const pv=[...d.pm.values()];
 const ev=[...d.em.values()];

 const now=new Date();
 const currentPrice=prices.find(x=>{
  const start=new Date(x.display_period.start);
  const end=new Date(x.display_period.end);
  return now>=start && now<end;
 }) || prices[prices.length-1];

 document.getElementById("price").textContent=
  currentPrice?money(currentPrice.price):"—";

 const priceTime=document.getElementById("priceTime");
 if(priceTime && currentPrice){
  const start=new Date(currentPrice.display_period.start);
  const end=new Date(currentPrice.display_period.end);
  priceTime.textContent=
   start.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})
   +"–"+
   end.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
 }

 document.getElementById("emissions").textContent=
  emissions.length
   ?carbon(emissions[emissions.length-1].emissions)
   :"—";

 document.getElementById("priceDay").textContent=
  pv.length?money(avg(pv)):"—";

 document.getElementById("emissionsDay").textContent=
  ev.length?carbon(avg(ev)):"—";

 document.getElementById("price30").textContent=
  prices.length
   ?money(avg(prices.map(x=>x.price)))
   :"—";

 document.getElementById("emissions30").textContent=
  emissions.length
   ?carbon(avg(emissions.map(x=>x.emissions)))
   :"—";

 document.getElementById("date").textContent=
  selectedDate.toLocaleDateString("en-GB",{
   weekday:"long",
   day:"numeric",
   month:"long",
   year:"numeric"
  });
}

function buttons(){
 document.getElementById("bp")
  .classList.toggle("active",mode==="price");

 document.getElementById("be")
  .classList.toggle("active",mode==="emissions");

 document.getElementById("bb")
  .classList.toggle("active",mode==="both");
}
function overviewDraw(){
 const {x,w,h}=size(overview);
 x.clearRect(0,0,w,h);

 const days=[...new Set([
  ...prices.map(v=>key(v.display_period.start)),
  ...emissions.map(v=>key(v.display_period.start))
 ])].sort();

 if(!days.length)return;

 const pv=days.map(d=>avg(
  prices
   .filter(v=>key(v.display_period.start)===d)
   .map(v=>v.price)
 ));

 const ev=days.map(d=>avg(
  emissions
   .filter(v=>key(v.display_period.start)===d)
   .map(v=>v.emissions)
 ));

 function ol(values,color){
  const a=values.filter(v=>v>0);
  if(!a.length)return;

  const min=Math.min(...a);
  const max=Math.max(...a);
  const range=max-min||1;

  x.beginPath();

  values.forEach((v,i)=>{
   if(!v)return;

   const xx=i/Math.max(values.length-1,1)*w;
   const yy=h-20-((v-min)/range)*(h-30);

   if(i===0)x.moveTo(xx,yy);
   else x.lineTo(xx,yy);
  });

  x.strokeStyle=color;
  x.lineWidth=2;
  x.stroke();
 }

 ol(pv,"#111");
 ol(ev,"#d00000");

 x.fillStyle="#777";
 x.font="10px system-ui";
 x.fillText(days[0],0,h-4);
 x.textAlign="right";
 x.fillText(days[days.length-1],w,h-4);
 x.textAlign="left";
}

function render(){
 buttons();
 updateCards();
 draw();
 overviewDraw();
}

function info(){
 const d=dayData();

 if(!d.times.length)return;

 if(selectedIndex<0)
  selectedIndex=Math.floor(d.times.length/2);

 const t=d.times[selectedIndex];
 const p=d.pm.get(t);
 const e=d.em.get(t);

 let s="<strong>"+time(t)+"</strong>";

 if(p!==undefined)
  s+=" &nbsp; <b>Price: "+money(p)+"</b>";

 if(e!==undefined)
  s+=' &nbsp; <b style="color:#d00000">Emissions: '+
   carbon(e)+"</b>";

 document.getElementById("info").innerHTML=s;
}

function changeDay(n){
 const d=new Date(selectedDate);
 d.setDate(d.getDate()+n);

 const k=key(d);

 const available=new Set([
  ...prices.map(v=>key(v.display_period.start)),
  ...emissions.map(v=>key(v.display_period.start))
 ]);

 if(available.has(k)){
  selectedDate=d;
  selectedIndex=-1;
  render();
  info();
 }
}

document.getElementById("bp").onclick=()=>{
 mode="price";
 render();
};

document.getElementById("be").onclick=()=>{
 mode="emissions";
 render();
};

document.getElementById("bb").onclick=()=>{
 mode="both";
 render();
};

document.getElementById("prev").onclick=()=>{
 changeDay(-1);
};

document.getElementById("next").onclick=()=>{
 changeDay(1);
};

chart.onclick=e=>{
 const d=dayData();

 if(!d.times.length)return;

 const rect=chart.getBoundingClientRect();
 const l=52;
 const r=mode==="both"?58:18;
 const pw=rect.width-l-r;

 const ratio=Math.max(
  0,
  Math.min(
   1,
   (e.clientX-rect.left-l)/pw
  )
 );

 selectedIndex=Math.round(
  ratio*(d.times.length-1)
 );

 info();
};

async function load(){
 try{
  const [pr,er]=await Promise.all([
   fetch(P),
   fetch(E)
  ]);

  prices=await pr.json();
  emissions=await er.json();

  const dates=[
   ...prices.map(v=>new Date(v.display_period.start)),
   ...emissions.map(v=>new Date(v.display_period.start))
  ];

  selectedDate=new Date();
  selectedDate.setHours(0,0,0,0);

  document.getElementById("loading")?.remove();

  render();
  info();

 }catch(err){
  document.body.innerHTML=
   "<p style='padding:20px'>Unable to load electricity data.</p>";
  console.error(err);
 }
}

window.onresize=render;
load();
</script>
</main>
</body>
</html>
