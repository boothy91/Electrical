<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Electricity Price</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f7fa;
    color: #17202a;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 20px 14px 40px;
}

header {
    text-align: center;
    margin-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    color: #68737d;
    margin-top: 4px;
}

.current {
    background: white;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 2px 12px #0001;
    margin-bottom: 16px;
}

.current-price {
    font-size: 42px;
    font-weight: 750;
}

.current-period {
    color: #68737d;
    margin-top: 5px;
}

.averages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

.average {
    background: #f5f7fa;
    border-radius: 12px;
    padding: 12px 8px;
}

.average-label {
    color: #68737d;
    font-size: 12px;
    margin-bottom: 4px;
}

.average-value {
    font-size: 20px;
    font-weight: 700;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 2px 12px #0001;
    margin-bottom: 16px;
}

.day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.day-title {
    font-size: 21px;
    font-weight: 700;
    text-align: center;
    flex: 1;
}

button {
    border: 0;
    background: #edf1f5;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 18px;
    cursor: pointer;
}

button:disabled {
    opacity: .35;
}

.chart-wrap {
    position: relative;
    width: 100%;
    height: 430px;
}

canvas {
    width: 100%;
    height: 100%;
    touch-action: none;
}

.info {
    min-height: 74px;
    margin-top: 12px;
    padding: 13px;
    background: #f5f7fa;
    border-radius: 12px;
    text-align: center;
}

.info-price {
    font-size: 24px;
    font-weight: 700;
}

.info-time {
    color: #68737d;
    margin-top: 3px;
}

.overview-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
}

.overview-wrap {
    height: 150px;
}

#overview {
    width: 100%;
    height: 100%;
    touch-action: none;
}

.hint {
    text-align: center;
    color: #7a858e;
    font-size: 13px;
    margin-top: 8px;
}

@media (max-width: 600px) {
    main {
        padding: 14px 10px 30px;
    }

    h1 {
        font-size: 24px;
    }

    .current-price {
        font-size: 36px;
    }

    .average-value {
        font-size: 17px;
    }

    .chart-wrap {
        height: 390px;
    }

    .day-title {
        font-size: 18px;
    }

    button {
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<main>

<header>
    <h1>UK Electricity Price</h1>
    <div class="subtitle">Electric Insights · £/MWh</div>
</header>

<section class="current">
    <div class="current-price" id="currentPrice">Loading…</div>
    <div class="current-period" id="currentPeriod"></div>

    <div class="averages">
        <div class="average">
            <div class="average-label">Selected day average</div>
            <div class="average-value" id="dailyAverage">—</div>
        </div>

        <div class="average">
            <div class="average-label">30-day average</div>
            <div class="average-value" id="monthlyAverage">—</div>
        </div>
    </div>
</section>

<section class="card">

    <div class="day-header">
        <button id="prevDay">‹</button>
        <div class="day-title" id="dayTitle">Loading…</div>
        <button id="nextDay">›</button>
    </div>

    <div class="chart-wrap">
        <canvas id="chart"></canvas>
    </div>

    <div class="info" id="info">
        <div>Tap a point to see the price</div>
    </div>

    <div class="hint">
        30-minute electricity prices · tap any point
    </div>

</section>

<section class="card">
    <div class="overview-title">30-day overview</div>
    <div class="overview-wrap">
        <canvas id="overview"></canvas>
    </div>
    <div class="hint">Tap a day to open it</div>
</section>

</main>

<script>
let history = [];
let days = [];
let selectedDay = 0;

const chart = document.getElementById("chart");
const overview = document.getElementById("overview");

const ctx = chart.getContext("2d");
const octx = overview.getContext("2d");

function money(v) {
    return "£" + Number(v).toFixed(2) + "/MWh";
}

function dateKey(iso) {
    return iso.slice(0, 10);
}

function formatDate(key) {
    return new Date(key + "T12:00:00").toLocaleDateString(
        undefined,
        { weekday: "short", day: "numeric", month: "short" }
    );
}

function formatTime(iso) {
    return new Date(iso).toLocaleTimeString(
        undefined,
        { hour: "2-digit", minute: "2-digit", hour12: false }
    );
}

function resizeCanvas(canvas, context) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    context.setTransform(dpr, 0, 0, dpr, 0, 0);

    return {
        width: rect.width,
        height: rect.height
    };
}

function drawDay() {
    const size = resizeCanvas(chart, ctx);
    const w = size.width;
    const h = size.height;

    ctx.clearRect(0, 0, w, h);

    const data = days[selectedDay] || [];

    if (!data.length) return;

    const pad = {
        left: 48,
        right: 15,
        top: 20,
        bottom: 42
    };

    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const values = data.map(x => Number(x.price));

    let min = Math.min(...values);
    let max = Math.max(...values);

    const range = Math.max(max - min, 10);
    min -= range * 0.12;
    max += range * 0.12;

    function x(i) {
        return pad.left + (i / Math.max(data.length - 1, 1)) * plotW;
    }

    function y(v) {
        return pad.top + (max - v) / (max - min) * plotH;
    }

    ctx.strokeStyle = "#dfe4e8";
    ctx.lineWidth = 1;
    ctx.fillStyle = "#68737d";
    ctx.font = "12px system-ui";

    for (let i = 0; i <= 4; i++) {
        const value = min + (max - min) * i / 4;
        const yy = y(value);

        ctx.beginPath();
        ctx.moveTo(pad.left, yy);
        ctx.lineTo(w - pad.right, yy);
        ctx.stroke();

        ctx.textAlign = "right";
        ctx.fillText("£" + value.toFixed(0), pad.left - 7, yy + 4);
    }

    ctx.textAlign = "center";

    for (let hour = 0; hour <= 24; hour += 3) {
        const xx = pad.left + (hour / 24) * plotW;

        ctx.fillText(
            String(hour).padStart(2, "0") + ":00",
            xx,
            h - 13
        );

        ctx.strokeStyle = "#eef1f3";
        ctx.beginPath();
        ctx.moveTo(xx, pad.top);
        ctx.lineTo(xx, h - pad.bottom);
        ctx.stroke();
    }

    ctx.strokeStyle = "#202830";
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    data.forEach((item, i) => {
        const xx = x(i);
        const yy = y(Number(item.price));

        if (i === 0) ctx.moveTo(xx, yy);
        else ctx.lineTo(xx, yy);
    });

    ctx.stroke();

    ctx.fillStyle = "#202830";

    data.forEach((item, i) => {
        ctx.beginPath();
        ctx.arc(x(i), y(Number(item.price)), 3, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx._points = data.map((item, i) => ({
        x: x(i),
        y: y(Number(item.price)),
        item
    }));
}

function drawOverview() {
    const size = resizeCanvas(overview, octx);
    const w = size.width;
    const h = size.height;

    octx.clearRect(0, 0, w, h);

    if (!history.length) return;

    const pad = 5;

    const values = history.map(x => Number(x.price));
    let min = Math.min(...values);
    let max = Math.max(...values);

    const range = Math.max(max - min, 1);
    min -= range * .05;
    max += range * .05;

    function x(i) {
        return pad + i / Math.max(history.length - 1, 1) * (w - pad * 2);
    }

    function y(v) {
        return pad + (max - v) / (max - min) * (h - pad * 2);
    }

    octx.strokeStyle = "#202830";
    octx.lineWidth = 1.5;
    octx.beginPath();

    history.forEach((item, i) => {
        const xx = x(i);
        const yy = y(Number(item.price));

        if (i === 0) octx.moveTo(xx, yy);
        else octx.lineTo(xx, yy);
    });

    octx.stroke();

    octx.fillStyle = "#0001";

    const selected = days[selectedDay] || [];

    if (selected.length) {
        const first = history.indexOf(selected[0]);
        const last = history.indexOf(selected[selected.length - 1]);

        if (first >= 0 && last >= 0) {
            const xx1 = x(first);
            const xx2 = x(last);

            octx.fillRect(
                xx1,
                0,
                Math.max(xx2 - xx1, 3),
                h
            );
        }
    }

    octx._points = history.map((item, i) => ({
        x: x(i),
        y: y(Number(item.price)),
        item
    }));
}

function showPoint(item) {
    const start = new Date(item.display_period.start);
    const end = new Date(item.display_period.end);

    document.getElementById("info").innerHTML = `
        <div class="info-price">${money(item.price)}</div>
        <div class="info-time">
            ${start.toLocaleDateString(undefined, {
                weekday: "short",
                day: "numeric",
                month: "short",
                year: "numeric"
            })}
            · ${formatTime(item.display_period.start)}
            – ${formatTime(item.display_period.end)}
        </div>
    `;
}

function findPoint(canvas, event) {
    const rect = canvas.getBoundingClientRect();

    const px = event.clientX - rect.left;
    const py = event.clientY - rect.top;

    const points = canvas === chart ? ctx._points : octx._points;

    if (!points) return null;

    let closest = null;
    let distance = Infinity;

    points.forEach(point => {
        const d = Math.hypot(point.x - px, point.y - py);

        if (d < distance) {
            distance = d;
            closest = point;
        }
    });

    return distance <= 25 ? closest : null;
}

chart.addEventListener("pointerdown", event => {
    const point = findPoint(chart, event);

    if (point) showPoint(point.item);
});

overview.addEventListener("pointerdown", event => {
    const point = findPoint(overview, event);

    if (!point) return;

    const key = dateKey(point.item.display_period.start);
    const index = days.findIndex(day =>
        day.length && dateKey(day[0].display_period.start) === key
    );

    if (index >= 0) {
        selectedDay = index;
        update();
    }
});

document.getElementById("prevDay").onclick = () => {
    if (selectedDay > 0) {
        selectedDay--;
        update();
    }
};

document.getElementById("nextDay").onclick = () => {
    if (selectedDay < days.length - 1) {
        selectedDay++;
        update();
    }
};

function update() {
    const data = days[selectedDay] || [];

    document.getElementById("dayTitle").textContent =
        data.length ? formatDate(dateKey(data[0].display_period.start)) : "";

    const dailyAverage = data.length
        ? data.reduce((sum, item) => sum + Number(item.price), 0) / data.length
        : 0;

    const monthlyAverage = history.length
        ? history.reduce((sum, item) => sum + Number(item.price), 0) / history.length
        : 0;

    document.getElementById("dailyAverage").textContent =
        "£" + (dailyAverage / 1000).toFixed(5) + "/kWh";

    document.getElementById("monthlyAverage").textContent =
        "£" + (monthlyAverage / 1000).toFixed(5) + "/kWh";

    document.getElementById("prevDay").disabled = selectedDay <= 0;
    document.getElementById("nextDay").disabled =
        selectedDay >= days.length - 1;

    drawDay();
    drawOverview();
}

async function loadData() {
    const stamp = Date.now();

    const [priceResponse, historyResponse] = await Promise.all([
        fetch("price.json?t=" + stamp),
        fetch("history.json?t=" + stamp)
    ]);

    const price = await priceResponse.json();
    history = await historyResponse.json();

    history.sort((a, b) =>
        a.display_period.start.localeCompare(
            b.display_period.start
        )
    );

    document.getElementById("currentPrice").textContent =
        money(price.price);

    document.getElementById("currentPeriod").textContent =
        formatDate(dateKey(price.display_period.start)) +
        " · " +
        formatTime(price.display_period.start) +
        " – " +
        formatTime(price.display_period.end);

    const grouped = new Map();

    history.forEach(item => {
        const key = dateKey(item.display_period.start);

        if (!grouped.has(key)) grouped.set(key, []);

        grouped.get(key).push(item);
    });

    days = Array.from(grouped.values());

    selectedDay = days.length - 1;

    update();
}

window.addEventListener("resize", update);

loadData().catch(error => {
    console.error(error);
    document.getElementById("currentPrice").textContent =
        "Unable to load data";
});
</script>

</body>
</html>
