<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Electricity</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f1f6;color:#1b1530;font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:14px}
h1{margin:0 0 12px;font-size:22px}
.nav{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px #0001}
.nav .mid{flex:1;text-align:center}
.nav .when{font-size:22px;font-weight:800}
.nav .day{font-size:13px;color:#666;margin-top:2px}
.arrow{border:0;background:#1b1530;color:#fff;border-radius:50%;width:48px;height:48px;font-size:26px;line-height:1;cursor:pointer}
.arrow:disabled{opacity:.25}
.sub{display:flex;justify-content:space-between;margin:8px 2px}
.sub button{border:0;background:none;color:#5b3fd0;font-weight:700;font-size:13px;padding:6px;cursor:pointer}
.sub button:disabled{opacity:.3}
.circles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat{background:#1b1530;color:#fff;border-radius:18px;padding:16px 10px;text-align:center}
.ring{position:relative;width:150px;max-width:100%;aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.val{font-size:26px;font-weight:800}
.unit{font-size:12px;opacity:.7}
.name{margin-top:10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.level{font-size:20px;font-weight:800;margin-top:2px}
.note{font-size:12px;opacity:.75;margin-top:4px}
.box{background:#fff;border-radius:16px;margin-top:12px;padding:12px;box-shadow:0 2px 8px #0001}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:0;border-radius:9px;padding:8px 12px;font-weight:700;background:#e4e2ec;cursor:pointer}
.tabs button.on{background:#1b1530;color:#fff}
.chart{height:280px}
canvas{width:100%;height:100%;display:block}
.hint{font-size:12px;color:#777;margin-top:6px}
.avg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.avg span{display:block;font-size:10px;color:#777;text-transform:uppercase}
.gen h2{margin:0 0 10px;font-size:15px}
.row{display:grid;grid-template-columns:110px 1fr 120px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.row b{font-weight:700}
.track{background:#ece9f4;border-radius:6px;height:12px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.row .num{text-align:right;color:#444;font-variant-numeric:tabular-nums}
@media(max-width:480px){.row{grid-template-columns:90px 1fr 100px;font-size:12px}.val{font-size:21px}.ring{width:130px}.chart{height:240px}}
</style>
</head>
<body>
<main>
<h1>⚡ UK Electricity</h1>

<div class="nav">
 <button class="arrow" id="prev" aria-label="Earlier">‹</button>
 <div class="mid">
  <div class="when" id="when">—</div>
  <div class="day" id="day"></div>
 </div>
 <button class="arrow" id="next" aria-label="Later">›</button>
</div>
<div class="sub">
 <button id="prevDay">« Previous day</button>
 <button id="now">Jump to now</button>
 <button id="nextDay">Next day »</button>
</div>

<div class="circles">
 <div class="stat">
  <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff22" stroke-width="9"/><circle id="pArc" cx="50" cy="50" r="42" fill="none" stroke="#53e539" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 264"/></svg>
   <div class="in"><div class="val" id="pVal">—</div><div class="unit">per kWh</div></div></div>
  <div class="name">Electricity price</div>
  <div class="level" id="pLevel">—</div>
  <div class="note" id="pNote"></div>
 </div>
 <div class="stat">
  <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff22" stroke-width="9"/><circle id="eArc" cx="50" cy="50" r="42" fill="none" stroke="#53e539" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 264"/></svg>
   <div class="in"><div class="val" id="eVal">—</div><div class="unit">gCO₂ per kWh</div></div></div>
  <div class="name">Carbon emissions</div>
  <div class="level" id="eLevel">—</div>
  <div class="note" id="eNote"></div>
 </div>
</div>

<div class="box gen" id="genBox" hidden>
 <h2>Where the power comes from</h2>
 <div id="genRows"></div>
</div>

<div class="box">
 <div class="tabs">
  <button id="bp" class="on">Price</button>
  <button id="be">Emissions</button>
  <button id="bb">Both</button>
 </div>
 <div class="chart"><canvas id="chart"></canvas></div>
 <div class="hint">Tap or drag on the chart to move to another time. Black = price, red = emissions.</div>
 <div class="avg">
  <div><span>Price – this day</span><b id="pDay">—</b></div>
  <div><span>Price – 30 days</span><b id="p30">—</b></div>
  <div><span>Emissions – this day</span><b id="eDay">—</b></div>
  <div><span>Emissions – 30 days</span><b id="e30">—</b></div>
 </div>
</div>

<script>
const GREEN="#53e539",AMBER="#ffb020",RED="#ff4b4b";
let prices=[],emissions=[],mode="price";
let slots=[],pm=new Map(),em=new Map(),ends=new Map(),idx=0;
const $=id=>document.getElementById(id);
const cv=$("chart");

const key=v=>{const d=new Date(v);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const hm=v=>new Date(v).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const money=v=>"£"+(Number(v)/1000).toFixed(4);
const carbon=v=>Math.round(v)+" gCO₂/kWh";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const daySlots=()=>{const k=key(slots[idx]);return slots.map((s,i)=>i).filter(i=>key(slots[i])===k)};

// Rank of a value against all 30-day values -> level, colour, plain-English note
function rate(v,all,lowWord,midWord,highWord,cheapPhrase){
 const lower=all.filter(x=>x<v).length/all.length;
 const pct=Math.round(lower*100);
 let level,col;
 if(lower<.33){level=lowWord;col=GREEN}
 else if(lower<.66){level=midWord;col=AMBER}
 else{level=highWord;col=RED}
 const note=pct<=50?`Lower than ${100-pct}% of the last 30 days`:`Higher than ${pct}% of the last 30 days`;
 return{level,col,note,frac:Math.max(.05,lower)};
}

function arc(id,frac,col){
 const el=$(id),c=2*Math.PI*42;
 el.setAttribute("stroke-dasharray",(c*frac)+" "+c);
 el.setAttribute("stroke",col);
}

function size(c){
 const r=c.getBoundingClientRect(),d=devicePixelRatio||1;
 c.width=r.width*d;c.height=r.height*d;
 const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);
 return{x,w:r.width,h:r.height};
}

function cards(){
 const s=slots[idx];
 $("when").textContent=hm(s)+(ends.get(s)?" – "+hm(ends.get(s)):"");
 const isNow=idx===slots.length-1;
 $("day").textContent=new Date(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+(isNow?" · latest":"");
 $("prev").disabled=idx===0;
 $("next").disabled=isNow;
 $("now").disabled=isNow;
 const ds=daySlots();
 $("prevDay").disabled=!slots.some(t=>key(t)<key(s));
 $("nextDay").disabled=!slots.some(t=>key(t)>key(s));

 const p=pm.get(s),e=em.get(s);
 if(p!==undefined){
  const r=rate(p,prices.map(x=>+x.price),"Cheap","Average","Expensive");
  $("pVal").textContent=money(p);$("pLevel").textContent=r.level;$("pLevel").style.color=r.col;$("pNote").textContent=r.note;
  arc("pArc",r.frac,r.col);
 }else{$("pVal").textContent="—";$("pLevel").textContent="No data";$("pNote").textContent="";arc("pArc",0,GREEN)}
 if(e!==undefined){
  const r=rate(e,emissions.map(x=>+x.emissions),"Low","Medium","High");
  $("eVal").textContent=Math.round(e);$("eLevel").textContent=r.level;$("eLevel").style.color=r.col;$("eNote").textContent=r.note;
  arc("eArc",r.frac,r.col);
 }else{$("eVal").textContent="—";$("eLevel").textContent="No data";$("eNote").textContent="";arc("eArc",0,GREEN)}

 const pv=ds.map(i=>pm.get(slots[i])).filter(v=>v!==undefined);
 const ev=ds.map(i=>em.get(slots[i])).filter(v=>v!==undefined);
 $("pDay").textContent=pv.length?money(avg(pv))+"/kWh":"—";
 $("eDay").textContent=ev.length?carbon(avg(ev)):"—";
 $("p30").textContent=prices.length?money(avg(prices.map(x=>+x.price)))+"/kWh":"—";
 $("e30").textContent=emissions.length?carbon(avg(emissions.map(x=>+x.emissions))):"—";
 genPanel();
}

const GEN=new Map();
const GCOL={solar:"#ffc928",wind:"#4fc3f7",hydro:"#2a7de1",gas:"#9a9a9a",coal:"#444",biomass:"#6bbf59",nuclear:"#b44fe0",pumpedstorage:"#1fb5ad",oil:"#8d5a3b",imports:"#e8793a",other:"#bbb"};
const prettify=k=>k.replace(/([a-z])([A-Z])/g,"$1 $2").replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
function genList(v){
 if(Array.isArray(v)){
  const o={};
  v.forEach(it=>{const k=it.fuel||it.fuelType||it.name||it.type||it.source;const n=it.value??it.mw??it.generation??it.output;if(k!==undefined)o[k]=n});
  v=o;
 }
 const out=[];
 for(const k in v){
  if(/^total/i.test(k))continue;
  let n=v[k];
  if(n&&typeof n==="object")n=Object.values(n).reduce((a,b)=>a+(typeof b==="number"?b:0),0);
  if(typeof n!=="number"||isNaN(n))continue;
  out.push({k,name:/import|export/i.test(k)?"Imports & Exports":prettify(k),gw:n/1000});
 }
 const total=out.reduce((a,b)=>a+b.gw,0)||1;
 out.forEach(o=>o.pct=o.gw/total*100);
 return out.sort((a,b)=>b.gw-a.gw);
}
function genPanel(){
 const v=GEN.get(slots[idx]);
 $("genBox").hidden=false;
 const msg=t=>{$("genRows").innerHTML=`<div style="font-size:13px;color:#666">${t}</div>`};
 if(!GEN.size)return msg("No generation data loaded. Check that <b>generation_history.json</b> is in the same folder as this page (run <code>python collect.py --refresh</code> and upload it).");
 if(!v)return msg("No generation data for this time.");
 let list=genList(v);
 if(!list.length){
  const sub=Object.values(v).find(x=>x&&typeof x==="object"&&!Array.isArray(x));
  if(sub)list=genList(sub);
 }
 if(!list.length)return msg("Couldn't read the generation data. Fields found: "+JSON.stringify(v).slice(0,300));
 $("genRows").innerHTML=list.map(o=>{
  const c=GCOL[o.k.toLowerCase().replace(/[^a-z]/g,"")]||(/import|export/i.test(o.k)?GCOL.imports:GCOL.other);
  return `<div class="row"><b>${o.name}</b><div class="track"><div class="fill" style="width:${Math.min(Math.abs(o.pct),100)}%;background:${c}"></div></div><div class="num">${o.gw.toFixed(2)} GW · ${o.pct.toFixed(1)}%</div></div>`;
 }).join("");
}

function lineOf(x,vals,col,l,t,w,h,min,max){
 const rg=max-min||1;x.beginPath();let started=false;
 vals.forEach((v,i)=>{
  if(v===undefined)return;
  const px=l+i/Math.max(vals.length-1,1)*w,py=t+h-(v-min)/rg*h;
  started?x.lineTo(px,py):x.moveTo(px,py);started=true;
 });
 x.strokeStyle=col;x.lineWidth=2.5;x.stroke();
}

function chart(){
 const {x,w,h}=size(cv);x.clearRect(0,0,w,h);
 const ds=daySlots(),n=ds.length;
 const showP=mode!=="emissions",showE=mode!=="price";
 const l=showP?54:12,r=showE?40:12,t=14,b=28,pw=w-l-r,ph=h-t-b;
 x.strokeStyle="#e5e5ea";x.lineWidth=1;
 for(let i=0;i<=4;i++){const y=t+i/4*ph;x.beginPath();x.moveTo(l,y);x.lineTo(l+pw,y);x.stroke()}
 const pv=ds.map(i=>pm.get(slots[i])),ev=ds.map(i=>em.get(slots[i]));
 const rng=a=>{const f=a.filter(v=>v!==undefined);return f.length?[Math.min(...f),Math.max(...f)]:[0,1]};
 const [pmin,pmax]=rng(pv),[emin,emax]=rng(ev);
 x.font="10px system-ui";
 if(showP){
  lineOf(x,pv,"#111",l,t,pw,ph,pmin,pmax);
  x.fillStyle="#111";x.textAlign="left";
  for(let i=0;i<=4;i++)x.fillText(money(pmax-(pmax-pmin)*i/4),2,t+i/4*ph+3);
 }
 if(showE){
  lineOf(x,ev,"#d00000",l,t,pw,ph,emin,emax);
  x.fillStyle="#d00000";x.textAlign="left";
  for(let i=0;i<=4;i++)x.fillText(Math.round(emax-(emax-emin)*i/4),w-r+5,t+i/4*ph+3);
 }
 x.fillStyle="#777";x.textAlign="center";
 for(let i=0;i<n;i+=4)x.fillText(hm(slots[ds[i]]),l+i/Math.max(n-1,1)*pw,h-10);
 // marker for selected time
 const si=ds.indexOf(idx);
 if(si>=0){
  const px=l+si/Math.max(n-1,1)*pw;
  x.strokeStyle="#5b3fd0";x.lineWidth=2;x.beginPath();x.moveTo(px,t);x.lineTo(px,t+ph);x.stroke();
  const dot=(v,min,max,c)=>{if(v===undefined)return;const py=t+ph-(v-min)/((max-min)||1)*ph;x.beginPath();x.arc(px,py,5,0,7);x.fillStyle="#fff";x.fill();x.strokeStyle=c;x.lineWidth=2.5;x.stroke()};
  if(showP)dot(pv[si],pmin,pmax,"#111");
  if(showE)dot(ev[si],emin,emax,"#d00000");
 }
}

function render(){
 ["bp","be","bb"].forEach((id,i)=>$(id).classList.toggle("on",["price","emissions","both"][i]===mode));
 cards();chart();
}
const go=n=>{const i=idx+n;if(i>=0&&i<slots.length){idx=i;render()}};
function goDay(dir){
 const k=key(slots[idx]);
 const cand=dir<0?slots.filter(s=>key(s)<k):slots.filter(s=>key(s)>k);
 if(!cand.length)return;
 const targetKey=dir<0?key(cand[cand.length-1]):key(cand[0]);
 const inDay=slots.map((s,i)=>i).filter(i=>key(slots[i])===targetKey);
 // keep the same time of day if possible
 const want=new Date(slots[idx]);const wm=want.getHours()*60+want.getMinutes();
 let best=inDay[0],bd=1e9;
 inDay.forEach(i=>{const d=new Date(slots[i]);const diff=Math.abs(d.getHours()*60+d.getMinutes()-wm);if(diff<bd){bd=diff;best=i}});
 idx=best;render();
}

$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("prevDay").onclick=()=>goDay(-1);
$("nextDay").onclick=()=>goDay(1);
$("now").onclick=()=>{idx=slots.length-1;render()};
$("bp").onclick=()=>{mode="price";render()};
$("be").onclick=()=>{mode="emissions";render()};
$("bb").onclick=()=>{mode="both";render()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});

function pick(e){
 const ds=daySlots(),rect=cv.getBoundingClientRect();
 const showP=mode!=="emissions",showE=mode!=="price";
 const l=showP?54:12,r=showE?40:12,pw=rect.width-l-r;
 const ratio=Math.max(0,Math.min(1,(e.clientX-rect.left-l)/pw));
 idx=ds[Math.round(ratio*(ds.length-1))];render();
}
let drag=false;
cv.addEventListener("pointerdown",e=>{drag=true;pick(e)});
cv.addEventListener("pointermove",e=>{if(drag)pick(e)});
addEventListener("pointerup",()=>drag=false);
cv.style.touchAction="pan-y";

async function load(){
 try{
  const [pr,er]=await Promise.all([fetch("history.json"),fetch("emissions_history.json")]);
  prices=await pr.json();emissions=await er.json();
  try{
   const gr=await fetch("generation_history.json");
   if(gr.ok)(await gr.json()).forEach(v=>GEN.set(v.display_period.start,v.generation));
  }catch(e){console.warn("No generation data",e)}
  const now=new Date(),set=new Set();
  prices.forEach(v=>{const s=v.display_period.start;pm.set(s,+v.price);ends.set(s,v.display_period.end);if(new Date(s)<=now)set.add(s)});
  emissions.forEach(v=>{const s=v.display_period.start;em.set(s,+v.emissions);if(!ends.has(s))ends.set(s,v.display_period.end);if(new Date(s)<=now)set.add(s)});
  slots=[...set].sort((a,b)=>new Date(a)-new Date(b));
  if(!slots.length)throw new Error("no data");
  // start on the slot that contains "now"
  idx=slots.length-1;
  render();
 }catch(err){
  document.querySelector("main").innerHTML="<p style='padding:20px'>Unable to load electricity data.</p>";
  console.error(err);
 }
}
addEventListener("resize",()=>slots.length&&render());
load();
</script>
</main>
</body>
</html>
